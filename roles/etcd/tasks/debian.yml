---
- name: Install packages on Debian-based systems
  apt:
    name: "{{ item }}"
    state: present
    update_cache: yes
  loop: "{{ packages_debian_all }}"
  when: ansible_facts['os_family'] == 'Debian'
  become: true 
  
- name: Check if UFW is installed
  command: which ufw
  register: ufw_check
  changed_when: false
  failed_when: false

- name: Check if UFW is active
  command: ufw status
  register: ufw_status
  changed_when: false
  failed_when: false
  when: ufw_check.rc == 0

- name: Open etcd ports in UFW
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ etcd_ports }}"
  when: 
    - ansible_facts['os_family'] == 'Debian'
    - ufw_check.rc == 0
    - ufw_status.stdout is defined
    - "'Status: active' in ufw_status.stdout"
  become: true
