---
# pgBackRest Configuration

# Stanza name (automatically uses patroni_scope)
pgbackrest_stanza: "{{ patroni_scope }}"

# Backup credentials
pgbackrest_backup_username: "postgres"
pgbackrest_backup_password: "test"

# Encryption
pgbackrest_cipher_pass: "Yf8E4coA2SukDpWyOe9KXZhGbq/v1JNL7xMCRdmUg+TwPnLIhs6HjaYlFt3QzWOB"

# Logging
pgbackrest_log_path: "/var/log/pgbackrest/"

# Backup Schedule (cron format)
pgbackrest_crontab_interval_full: "0 2 * * MON,WED,FRI,SUN"  # Full: Mon, Wed, Fri, Sun at 2 AM
pgbackrest_crontab_interval_diff: "0 2 * * TUE,THU,SAT"      # Diff: Tue, Thu, Sat at 2 AM
